<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Sistema de Gestión Documental
</title>


<link rel="stylesheet" href="css/estilo.css">


</head>


<body>


<header>


<h1>
Sistema de Gestión Documental
</h1>


<p>
Control y administración de documentos
</p>



<div class="usuario-panel">


<span id="bienvenida"></span>


<button onclick="cerrarSesion()">

Cerrar sesión

</button>


</div>



</header>






<!-- MENU DINAMICO -->

<nav class="menu" id="menu">

</nav>







<main>



<section class="resumen">


<div class="tarjeta">

<h3>
📄 Documentos
</h3>

<p id="cantidadDocumentos">
0
</p>

</div>




<div class="tarjeta">

<h3>
📁 Proyectos
</h3>

<p>
3
</p>

</div>




<div class="tarjeta">

<h3>
👥 Usuarios
</h3>

<p>
1
</p>

</div>




<div class="tarjeta">

<h3>
✅ Aprobaciones
</h3>

<p>
0
</p>

</div>


</section>









<!-- SUBIR DOCUMENTO -->

<section 
id="formDocumento"
class="panel"
style="display:none;">



<h2>
Registrar documento
</h2>




<label>
Proyecto
</label>


<br>


<select id="proyecto">


<option value="1">
VOLCAN
</option>


<option value="2">
TALARA
</option>


<option value="3">
COEMSA
</option>


</select>



<br><br>





<label>
Archivo
</label>


<br>


<input 
type="file"
id="archivo">





<br><br>




<input

type="text"

id="tipoArchivo"

placeholder="Tipo de archivo">




<br><br>




<textarea

id="descripcion"

placeholder="Descripción">

</textarea>





<br><br>



<button onclick="guardarDocumento()">

Guardar documento

</button>




</section>









<section class="panel">


<h2>
Documentos registrados
</h2>





<div class="filtro">


<label>
Filtrar proyecto:
</label>



<select id="filtroProyecto" onchange="filtrarProyecto()">



<option value="todos">

Todos

</option>



<option value="1">

VOLCAN

</option>



<option value="2">

TALARA

</option>



<option value="3">

COEMSA

</option>



</select>


</div>







<table>


<thead>


<tr>


<th>
ID
</th>


<th>
Archivo
</th>


<th>
Tipo
</th>


<th>
Estado
</th>


<th>
Proyecto
</th>


<th>
Acción
</th>


</tr>


</thead>




<tbody id="tablaDocumentos">


</tbody>



</table>




</section>






</main>







<script src="js/app.js"></script>


</body>


</html>
