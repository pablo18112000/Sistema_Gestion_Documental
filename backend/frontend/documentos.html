<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Archivo documental | COEMSA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #19354d;
    }

    header {
      background: #123454;
      color: white;
      padding: 26px;
    }

    header h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0 0 22px;
      color: #d5e4ef;
    }

    nav,
    .acciones,
    .ruta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    header a {
      color: white;
    }

    main {
      max-width: 1300px;
      margin: 28px auto;
      padding: 0 20px;
    }

    button,
    .boton {
      display: inline-block;
      padding: 11px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      color: #173454;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .boton:hover {
      background: #eaf2f8;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #atras {
      display: none;
      background: #123454;
      color: white;
      border-color: #123454;
      font-weight: bold;
    }

    #atras:hover {
      background: #1d4b75;
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 3px solid #e6a700;
      outline-offset: 3px;
    }

    .ruta {
      padding: 16px;
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .ruta button {
      border: none;
      padding: 5px 8px;
      color: #075985;
      background: transparent;
    }

    .cabecera {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
    }

    h2 {
      margin-bottom: 8px;
    }

    .nota {
      color: #526577;
      line-height: 1.6;
    }

    .carpetas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }

    .carpeta {
      text-align: left;
      padding: 24px;
      min-height: 130px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #12345408;
    }

    .carpeta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px #12345418;
    }

    .icono {
      display: block;
      font-size: 30px;
      margin-bottom: 12px;
    }

    .nombre {
      display: block;
      font-weight: bold;
      font-size: 17px;
      overflow-wrap: anywhere;
    }

    .detalle {
      display: block;
      margin-top: 9px;
      color: #64748b;
      font-size: 14px;
    }

    .documentos {
      padding: 22px;
      border-radius: 14px;
      background: white;
      margin-bottom: 24px;
    }

    .buscador-documentos {
      margin-top: 15px;
    }

    input {
      width: 100%;
      max-width: 440px;
      padding: 12px;
      border: 1px solid #b8c8d6;
      border-radius: 8px;
      font: inherit;
    }

    .tabla {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th,
    td {
      padding: 13px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
    }

    th {
      background: #edf3f8;
    }

    td:first-child {
      min-width: 220px;
      overflow-wrap: anywhere;
    }

    .estado {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 15px;
      background: #edf0f4;
    }

    .aprobado {
      background: #dcfce7;
      color: #166534;
    }

    .pendiente {
      background: #fef3c7;
      color: #854d0e;
    }

    .rechazado {
      background: #fee2e2;
      color: #991b1b;
    }

    #mensaje {
      min-height: 24px;
      line-height: 1.6;
    }

    [hidden] {
      display: none !important;
    }
  </style>
  <link rel="stylesheet" href="/css/navegacion.css">
  <script src="/js/navegacion.js" defer></script>
</head>

<body>

  <header>

    <h1>
      COEMSA · Archivo documental
    </h1>

    <p>
      Documentos organizados por áreas, clientes, unidades y proyectos.
    </p>

    <nav aria-label="Menú principal">

      <a id="volver" href="/login.html">
        Volver al panel
      </a>

      <a href="/subir_documento.html">
        Subir PDF
      </a>

      <a href="/buscar_documentos.html">
        Búsqueda general
      </a>

      <a id="proyectos" href="/proyectos.html">
        Proyectos
      </a>

      <button id="salir" type="button">
        Cerrar sesión
      </button>

    </nav>

  </header>

  <main>

    <p
      id="mensaje"
      role="status"
      aria-live="polite"
    >
      Comprobando sesión...
    </p>

    <div class="cabecera">

      <div>
        <h2 id="titulo">
          Organización documental
        </h2>

        <p
          id="descripcion"
          class="nota"
        ></p>
      </div>

      <div class="acciones">

        <button
          id="atras"
          type="button"
          style="display: none;"
        >
          ← Atrás
        </button>

        <button
          id="actualizar"
          type="button"
          disabled
        >
          Actualizar
        </button>

      </div>

    </div>

    <nav
      id="ruta"
      class="ruta"
      aria-label="Ubicación actual"
    ></nav>

    <div
      id="carpetas"
      class="carpetas"
    ></div>

    <section
      id="documentos"
      class="documentos"
      hidden
    >

      <h2>
        Documentos de esta carpeta
      </h2>

      <div class="buscador-documentos">

        <label for="buscar">
          Buscar documento:
        </label>

        <br><br>

        <input
          id="buscar"
          type="search"
          autocomplete="off"
          placeholder="Nombre, autor o estado"
        >

      </div>

      <p
        id="contador"
        class="nota"
      ></p>

      <div class="tabla">

        <table>

          <thead>
            <tr>
              <th>Documento</th>
              <th>Subido por</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>

          <tbody id="filas"></tbody>

        </table>

      </div>

    </section>

  </main>

  <script src="/js/auth.js"></script>

  <script>

    const $ = (id) =>
      document.getElementById(id);


    let secciones = [];
    let clientes = [];
    let unidades = [];
    let carpetas = [];
    let documentos = [];
    let documentosActuales = [];
    let pasos = [];
    let cargando = false;


    function normalizar(valor) {

      return String(valor ?? "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();

    }


    function mismo(a, b) {

      return (
        a != null &&
        b != null &&
        String(a) === String(b)
      );

    }


    async function consultar(url) {

      const respuesta = await fetch(url, {
        credentials: "same-origin",
        cache: "no-store"
      });


      if (respuesta.status === 401) {

        window.location.replace(
          "/login.html"
        );

        throw new Error(
          "La sesión terminó."
        );

      }


      const datos =
        await respuesta.json();


      if (
        !respuesta.ok ||
        !datos.success
      ) {

        throw new Error(
          datos.mensaje ||
          "No se pudo cargar la información."
        );

      }


      return datos;

    }


    function actualizarBotonAtras() {

      const boton =
        $("atras");


      if (pasos.length === 0) {

        boton.style.display =
          "none";

      } else {

        boton.style.display =
          "inline-block";

      }

    }


    function abrir(paso) {

      pasos.push(paso);

      $("buscar").value =
        "";

      dibujar();

    }


    function volverAtras() {

      if (
        pasos.length === 0
      ) {

        return;

      }


      pasos.pop();


      $("buscar").value =
        "";


      documentosActuales =
        [];


      dibujar();

    }


    function tarjeta(
      nombre,
      detalle,
      accion
    ) {

      const boton =
        document.createElement(
          "button"
        );


      boton.type =
        "button";


      boton.className =
        "carpeta";


      const icono =
        document.createElement(
          "span"
        );


      icono.className =
        "icono";


      icono.textContent =
        "📁";


      icono.setAttribute(
        "aria-hidden",
        "true"
      );


      const titulo =
        document.createElement(
          "span"
        );


      titulo.className =
        "nombre";


      titulo.textContent =
        nombre;


      const texto =
        document.createElement(
          "span"
        );


      texto.className =
        "detalle";


      texto.textContent =
        detalle;


      boton.append(
        icono,
        titulo,
        texto
      );


      boton.addEventListener(
        "click",
        accion
      );


      $("carpetas")
        .appendChild(
          boton
        );

    }


    function grupos(
      filas,
      campoId,
      campoNombre
    ) {

      const resultado =
        new Map();


      for (
        const fila
        of filas
      ) {

        if (
          fila[campoId] == null
        ) {

          continue;

        }


        resultado.set(
          String(
            fila[campoId]
          ),
          {
            id:
              fila[campoId],

            nombre:
              fila[campoNombre] ||
              "Sin nombre"
          }
        );

      }


      return [
        ...resultado.values()
      ].sort(
        (a, b) =>
          a.nombre.localeCompare(
            b.nombre,
            "es"
          )
      );

    }


    function dibujarRuta() {

      $("ruta")
        .replaceChildren();


      const inicio =
        document.createElement(
          "button"
        );


      inicio.type =
        "button";


      inicio.textContent =
        "COEMSA";


      inicio.addEventListener(
        "click",
        () => {

          pasos =
            [];


          $("buscar").value =
            "";


          documentosActuales =
            [];


          dibujar();

        }
      );


      $("ruta")
        .appendChild(
          inicio
        );


      pasos.forEach(
        (paso, indice) => {

          const separador =
            document.createElement(
              "span"
            );


          separador.textContent =
            "›";


          const boton =
            document.createElement(
              "button"
            );


          boton.type =
            "button";


          boton.textContent =
            paso.nombre;


          boton.addEventListener(
            "click",
            () => {

              pasos =
                pasos.slice(
                  0,
                  indice + 1
                );


              $("buscar").value =
                "";


              documentosActuales =
                [];


              dibujar();

            }
          );


          $("ruta").append(
            separador,
            boton
          );

        }
      );

    }


    function listarCarpetas(
      filas
    ) {

      const ids =
        new Set(
          filas.map(
            (f) =>
              String(
                f.id_carpeta
              )
          )
        );


      const principales =
        filas.filter(
          (f) =>
            f.id_carpeta_padre == null ||
            !ids.has(
              String(
                f.id_carpeta_padre
              )
            )
        );


      for (
        const carpeta
        of principales
      ) {

        tarjeta(
          carpeta.nombre_carpeta,
          "Abrir carpeta",
          () => abrir({
            tipo:
              "carpeta",

            id:
              carpeta.id_carpeta,

            nombre:
              carpeta.nombre_carpeta
          })
        );

      }


      if (
        !principales.length
      ) {

        $("descripcion")
          .textContent =
          "Todavía no hay carpetas disponibles en esta ubicación.";

      }

    }


    function seleccionarDocumentos(
      ids
    ) {

      const permitidas =
        new Set(
          ids.map(
            String
          )
        );


      documentosActuales =
        documentos.filter(
          (documento) =>
            permitidas.has(
              String(
                documento.id_carpeta
              )
            )
        );


      $("documentos").hidden =
        false;


      mostrarDocumentos();

    }


    function dibujar() {

      $("carpetas")
        .replaceChildren();


      $("documentos").hidden =
        true;


      $("descripcion")
        .textContent =
        "";


      $("contador")
        .textContent =
        "";


      documentosActuales =
        [];


      actualizarBotonAtras();


      dibujarRuta();


      const actual =
        pasos[
          pasos.length - 1
        ];


      $("titulo").textContent =
        actual
          ? actual.nombre
          : "Organización documental";


      /*
       * PÁGINA PRINCIPAL
       */

      if (!actual) {

        // Por seguridad se vuelve a ocultar aquí.
        $("atras").style.display =
          "none";


        $("descripcion")
          .textContent =
          "Selecciona una sección. Se respetan tus permisos actuales.";


        for (
          const seccion
          of secciones
        ) {

          tarjeta(
            seccion.nombre,
            "Abrir sección",
            () => abrir({
              tipo:
                "seccion",

              id:
                seccion.clave,

              nombre:
                seccion.nombre
            })
          );

        }


        return;

      }


      /*
       * SECCIÓN
       */

      if (
        actual.tipo ===
        "seccion"
      ) {

        const filas =
          carpetas.filter(
            (c) =>
              c.seccion ===
              actual.id
          );


        /*
         * LOGÍSTICA
         */

        if (
          actual.id ===
          "logistica"
        ) {

          $("descripcion")
            .textContent =
            "Logística se mantiene como una sola carpeta por ahora.";


          seleccionarDocumentos(
            filas.map(
              (c) =>
                c.id_carpeta
            )
          );


          return;

        }


        /*
         * SERVICIOS Y PROYECTOS
         */

        if (
          actual.id ===
          "servicios"
        ) {

          const ordenClientes = [
            "Volcan",
            "NEXA",
            "KOLPA",
            "LINCUNA",
            "OREX",
            "YAURICOCHA",
            "COLQUISIRI",
            "HOSPITAL",
            "OTROS"
          ];


          const clientesOrdenados =
            [...clientes].sort(
              (a, b) => {

                const posicionA =
                  ordenClientes.indexOf(
                    a.nombre_cliente
                  );


                const posicionB =
                  ordenClientes.indexOf(
                    b.nombre_cliente
                  );


                const ordenA =
                  posicionA === -1
                    ? 999
                    : posicionA;


                const ordenB =
                  posicionB === -1
                    ? 999
                    : posicionB;


                if (
                  ordenA !==
                  ordenB
                ) {

                  return (
                    ordenA -
                    ordenB
                  );

                }


                return String(
                  a.nombre_cliente
                ).localeCompare(
                  String(
                    b.nombre_cliente
                  ),
                  "es"
                );

              }
            );


          for (
            const cliente
            of clientesOrdenados
          ) {

            tarjeta(
              cliente.nombre_cliente,
              "Ver unidades",
              () => abrir({
                tipo:
                  "cliente",

                id:
                  cliente.id_cliente,

                nombre:
                  cliente.nombre_cliente
              })
            );

          }


          const sinCliente =
            filas.filter(
              (c) =>
                c.id_cliente ==
                null
            );


          if (
            sinCliente.length
          ) {

            tarjeta(
              "Pendientes de clasificación",
              "Carpetas y proyectos existentes sin cliente o unidad",
              () => abrir({
                tipo:
                  "pendientes",

                nombre:
                  "Pendientes de clasificación"
              })
            );

          }


          return;

        }


        /*
         * DEMÁS SECCIONES
         */

        listarCarpetas(
          filas
        );


        return;

      }


      /*
       * CLIENTE
       */

      if (
        actual.tipo ===
        "cliente"
      ) {

        const unidadesCliente =
          unidades.filter(
            (unidad) =>
              mismo(
                unidad.id_cliente,
                actual.id
              )
          );


        for (
          const unidad
          of unidadesCliente
        ) {

          tarjeta(
            unidad.nombre_unidad,
            "Ver proyectos",
            () => abrir({
              tipo:
                "unidad",

              id:
                unidad.id_unidad,

              nombre:
                unidad.nombre_unidad
            })
          );

        }


        if (
          !unidadesCliente.length
        ) {

          $("descripcion")
            .textContent =
            "Este cliente todavía no tiene unidades registradas.";

        }


        return;

      }


      /*
       * UNIDAD
       */

      if (
        actual.tipo ===
        "unidad"
      ) {

        const filas =
          carpetas.filter(
            (c) =>
              mismo(
                c.id_unidad,
                actual.id
              )
          );


        const proyectos =
          grupos(
            filas,
            "id_proyecto",
            "nombre_proyecto"
          );


        for (
          const proyecto
          of proyectos
        ) {

          tarjeta(
            proyecto.nombre,
            "Ver carpetas",
            () => abrir({
              tipo:
                "proyecto",

              id:
                proyecto.id,

              nombre:
                proyecto.nombre
            })
          );

        }


        if (
          !proyectos.length
        ) {

          $("descripcion")
            .textContent =
            "Esta unidad todavía no tiene proyectos registrados.";

        }


        return;

      }


      /*
       * PROYECTO
       */

      if (
        actual.tipo ===
        "proyecto"
      ) {

        const delProyecto =
          carpetas.filter(
            (c) =>
              mismo(
                c.id_proyecto,
                actual.id
              )
          );


        const principales =
          delProyecto.filter(
            (c) =>
              c.id_carpeta_padre ===
              null
          );


        if (
          principales.length ===
          1
        ) {

          const principal =
            principales[0];


          const categorias =
            delProyecto.filter(
              (c) =>
                mismo(
                  c.id_carpeta_padre,
                  principal.id_carpeta
                )
            );


          for (
            const categoria
            of categorias
          ) {

            tarjeta(
              categoria.nombre_carpeta,
              "Abrir categoría",
              () => abrir({
                tipo:
                  "carpeta",

                id:
                  categoria.id_carpeta,

                nombre:
                  categoria.nombre_carpeta
              })
            );

          }


          seleccionarDocumentos([
            principal.id_carpeta
          ]);


        } else {

          listarCarpetas(
            delProyecto
          );

        }


        return;

      }


      /*
       * PENDIENTES
       */

      if (
        actual.tipo ===
        "pendientes"
      ) {

        $("descripcion")
          .textContent =
          "Estos registros conservan su ubicación y permisos actuales.";


        listarCarpetas(
          carpetas.filter(
            (c) =>
              c.seccion ===
                "servicios" &&
              c.id_cliente ==
                null
          )
        );


        return;

      }


      /*
       * CARPETA
       */

      if (
        actual.tipo ===
        "carpeta"
      ) {

        const hijas =
          carpetas.filter(
            (c) =>
              mismo(
                c.id_carpeta_padre,
                actual.id
              )
          );


        for (
          const hija
          of hijas
        ) {

          tarjeta(
            hija.nombre_carpeta,
            "Abrir subcarpeta",
            () => abrir({
              tipo:
                "carpeta",

              id:
                hija.id_carpeta,

              nombre:
                hija.nombre_carpeta
            })
          );

        }


        seleccionarDocumentos([
          actual.id
        ]);


        return;

      }

    }


    function mostrarDocumentos() {

      $("filas")
        .replaceChildren();


      const termino =
        normalizar(
          $("buscar")
            .value
            .trim()
        );


      const visibles =
        documentosActuales.filter(
          (documento) => {

            const texto =
              normalizar([
                documento.nombre_archivo,
                documento.descripcion,
                documento.subido_por,
                documento.estado_documento
              ].join(" "));


            return texto.includes(
              termino
            );

          }
        );


      $("contador")
        .textContent =
        visibles.length +
        " documento(s) encontrado(s).";


      if (
        !visibles.length
      ) {

        const fila =
          document.createElement(
            "tr"
          );


        const celda =
          document.createElement(
            "td"
          );


        celda.colSpan =
          5;


        celda.textContent =
          termino
            ? "No se encontraron documentos con esa búsqueda."
            : "No hay documentos para mostrar.";


        fila.appendChild(
          celda
        );


        $("filas")
          .appendChild(
            fila
          );


        return;

      }


      for (
        const documento
        of visibles
      ) {

        const fila =
          document.createElement(
            "tr"
          );


        const fecha =
          new Date(
            documento.fecha_subida
          );


        const valores = [
          documento.nombre_archivo ||
            "Sin nombre",

          documento.subido_por ||
            "Sin registro",

          documento.fecha_subida &&
          !Number.isNaN(
            fecha.getTime()
          )
            ? fecha.toLocaleString(
                "es-PE",
                {
                  timeZone:
                    "America/Lima"
                }
              )
            : "Sin fecha"
        ];


        for (
          const valor
          of valores
        ) {

          const celda =
            document.createElement(
              "td"
            );


          celda.textContent =
            valor;


          fila.appendChild(
            celda
          );

        }


        const estadoCelda =
          document.createElement(
            "td"
          );


        const estado =
          document.createElement(
            "span"
          );


        const nombreEstado =
          documento.estado_documento ||
          "Sin estado";


        const clase =
          normalizar(
            nombreEstado
          ).trim();


        estado.className =
          "estado";


        if (
          [
            "aprobado",
            "pendiente",
            "rechazado"
          ].includes(
            clase
          )
        ) {

          estado.classList.add(
            clase
          );

        }


        estado.textContent =
          nombreEstado;


        estadoCelda.appendChild(
          estado
        );


        fila.appendChild(
          estadoCelda
        );


        const accion =
          document.createElement(
            "td"
          );


        const enlace =
          document.createElement(
            "a"
          );


        enlace.className =
          "boton";


        enlace.textContent =
          "Ver PDF";


        enlace.href =
          "/documentos/" +
          encodeURIComponent(
            documento.id_documento
          ) +
          "/ver";


        enlace.target =
          "_blank";


        enlace.rel =
          "noopener noreferrer";


        accion.appendChild(
          enlace
        );


        fila.appendChild(
          accion
        );


        $("filas")
          .appendChild(
            fila
          );

      }

    }


    async function cargar() {

      if (
        cargando
      ) {

        return;

      }


      cargando =
        true;


      $("actualizar")
        .disabled =
        true;


      $("mensaje")
        .textContent =
        "Cargando carpetas y documentos...";


      $("carpetas")
        .replaceChildren();


      $("documentos")
        .hidden =
        true;


      $("ruta")
        .replaceChildren();


      // Mientras carga estamos en la raíz.
      $("atras").style.display =
        "none";


      try {

        const organizacion =
          await consultar(
            "/documentos/organizacion"
          );


        const archivos =
          [];


        let completa =
          false;


        for (
          let pagina = 1;
          pagina <= 100;
          pagina++
        ) {

          const datos =
            await consultar(
              "/documentos?pagina=" +
              pagina
            );


          if (
            Array.isArray(
              datos.documentos
            )
          ) {

            archivos.push(
              ...datos.documentos
            );

          }


          if (
            !datos.hay_mas
          ) {

            completa =
              true;

            break;

          }


          $("mensaje")
            .textContent =
            "Cargando documentos: " +
            archivos.length +
            "...";

        }


        if (
          !completa
        ) {

          throw new Error(
            "Hay más de 10000 documentos. Debe habilitarse la consulta por carpeta antes de mostrar este explorador."
          );

        }


        secciones =
          Array.isArray(
            organizacion.secciones
          )
            ? organizacion.secciones
            : [];


        clientes =
          Array.isArray(
            organizacion.clientes
          )
            ? organizacion.clientes
            : [];


        unidades =
          Array.isArray(
            organizacion.unidades
          )
            ? organizacion.unidades
            : [];


        carpetas =
          Array.isArray(
            organizacion.carpetas
          )
            ? organizacion.carpetas
            : [];


        documentos =
          archivos;


        documentosActuales =
          [];


        pasos =
          [];


        $("buscar").value =
          "";


        dibujar();


        $("mensaje")
          .textContent =
          "Organización cargada. Esta vista no mueve archivos en Drive.";


      } catch (error) {

        console.error(
          "Error cargando archivo documental:",
          error
        );


        $("mensaje")
          .textContent =
          error.message ||
          "No se pudo cargar la organización.";


      } finally {

        cargando =
          false;


        $("actualizar")
          .disabled =
          false;

      }

    }


    $("buscar")
      .addEventListener(
        "input",
        mostrarDocumentos
      );


    $("atras")
      .addEventListener(
        "click",
        volverAtras
      );


    $("actualizar")
      .addEventListener(
        "click",
        cargar
      );


    $("salir")
      .addEventListener(
        "click",
        cerrarSesion
      );


    async function iniciar() {

      try {

        const usuario =
          await verificarSesion();


        if (
          !usuario
        ) {

          return;

        }


        const paneles = {

          Administrador:
            "/admin.html",

          Supervisor:
            "/supervisor.html",

          Usuario:
            "/usuario.html"

        };


        $("volver").href =
          paneles[
            usuario.nombre_rol
          ] ||
          "/login.html";


        await cargar();


      } catch (error) {

        console.error(
          "Error comprobando sesión:",
          error
        );


        $("mensaje")
          .textContent =
          "No se pudo comprobar la sesión. Actualiza la página.";

      }

    }


    iniciar();

  </script>
