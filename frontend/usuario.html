<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Panel Usuario
</title>


<link rel="stylesheet" href="css/usuario.css">


</head>


<body>


<header>


<h1>
Sistema de Gestión Documental
</h1>


<h2>
Panel del Usuario
</h2>


</header>




<main>



<section class="formulario">


<h2>
📤 Enviar Documento
</h2>



<form id="formDocumento">



<label>
Archivo PDF
</label>


<input 
type="file"
id="archivo"
name="archivo"
required>



<label>
ID Usuario
</label>


<input
type="number"
id="id_usuario"
name="id_usuario"
value="1"
required>




<label>
ID Proyecto
</label>


<input
type="number"
id="id_proyecto"
name="id_proyecto"
value="1"
required>




<label>
Descripción
</label>


<textarea
id="descripcion"
name="descripcion"
placeholder="Descripción del documento">

</textarea>





<button type="submit">

📤 Enviar documento

</button>



</form>



<p id="mensaje"></p>


</section>





<section>


<h2>
📂 Mis documentos
</h2>



<div id="listaDocumentos">


</div>

<div id="listaDocumentos">

</div>



<h2>
📂 Mis documentos enviados
</h2>



<div id="misDocumentos">

</div>



</section>




</main>



<script src="js/usuario.js"></script>


</body>

</html>
