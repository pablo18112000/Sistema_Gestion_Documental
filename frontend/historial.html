<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>
Historial Supervisor
</title>


<style>

body{

font-family:Arial;
background:#f1f5f9;
margin:0;

}


header{

background:#25618f;
color:white;
text-align:center;
padding:35px;

}


.container{

background:white;
margin:40px;
padding:30px;
border-radius:15px;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#25618f;
color:white;
padding:15px;

}


td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}


.aprobado{

color:green;
font-weight:bold;

}


.rechazado{

color:red;
font-weight:bold;

}


</style>


</head>



<body>


<header>

<h1>
📁 Sistema de Gestión Documental
</h1>

<h2>
Historial Supervisor
</h2>


</header>




<div class="container">


<h2>
📄 Documentos Revisados
</h2>



<table>


<thead>

<tr>

<th>
Archivo
</th>


<th>
Usuario
</th>


<th>
Correo
</th>


<th>
Estado
</th>


<th>
Fecha revisión
</th>


<th>
Comentario
</th>


</tr>


</thead>



<tbody id="tabla">


</tbody>


</table>



</div>





<script>


fetch(
"http://localhost:3000/aprobaciones/historial"
)


.then(res=>res.json())


.then(data=>{


let tabla=document.getElementById("tabla");


data.documentos.forEach(doc=>{


tabla.innerHTML += `


<tr>


<td>
${doc.nombre_archivo}
</td>


<td>
${doc.nombre} ${doc.apellido}
</td>


<td>
${doc.correo}
</td>


<td class="${doc.estado.toLowerCase()}">

${doc.estado}

</td>


<td>
${doc.fecha_revision || ""}
</td>


<td>
${doc.comentario || "-"}
</td>


</tr>


`;


});


});



</script>



</body>

</html>
