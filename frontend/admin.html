<!DOCTYPE html>

<html>

<head>

<title>
Panel Administrador
</title>


<link rel="stylesheet" href="css/estilo.css">


</head>


<body>


<header>


<h1>
📁 Sistema de Gestión Documental
</h1>


<h2>
Panel Administrador
</h2>


</header>





<section class="contenedor">



<div class="titulo">


<h2>
👥 Gestión de Usuarios
</h2>


<button onclick="abrirFormulario()">

➕ Nuevo Usuario

</button>


</div>






<!-- FORMULARIO CREAR -->

<div id="formularioUsuario" style="display:none;">


<h3>
Registrar Nuevo Usuario
</h3>



<input id="nombre" placeholder="Nombre">


<input id="apellido" placeholder="Apellido">


<input id="correo" placeholder="Correo">


<input id="password" type="password" placeholder="Contraseña">



<select id="rol">


<option value="1">
Administrador
</option>


<option value="2">
Supervisor
</option>


<option value="3">
Usuario
</option>


</select>



<select id="area">


<option value="1">
Recursos Humanos
</option>


<option value="2">
Servicios y/o Proyectos
</option>


<option value="3">
Administración
</option>


<option value="4">
Logística
</option>


<option value="5">
Seguridad
</option>


</select>



<button onclick="crearUsuario()">

Guardar Usuario

</button>



</div>







<!-- FORMULARIO EDITAR -->


<div id="editarUsuario" style="display:none;">


<h3>
Editar Usuario
</h3>



<input id="editNombre" placeholder="Nombre">


<input id="editApellido" placeholder="Apellido">


<input id="editCorreo" placeholder="Correo">



<select id="editRol">


<option value="1">
Administrador
</option>


<option value="2">
Supervisor
</option>


<option value="3">
Usuario
</option>


</select>




<select id="editArea">


<option value="1">
Recursos Humanos
</option>


<option value="2">
Servicios y/o Proyectos
</option>


<option value="3">
Administración
</option>


<option value="4">
Logística
</option>


<option value="5">
Seguridad
</option>


</select>



<button onclick="guardarEdicion()">

Guardar Cambios

</button>



</div>









<table>


<thead>


<tr>


<th>
Nombre
</th>


<th>
Apellido
</th>


<th>
Correo
</th>


<th>
Rol
</th>


<th>
Área
</th>


<th>
Estado
</th>


<th>
Acciones
</th>


</tr>


</thead>




<tbody id="listaUsuarios">



</tbody>




</table>




</section>





<script src="js/auth.js"></script>


<script>

verificarSesion("Administrador");


</script>



<script src="js/admin.js"></script>




</body>


</html>
